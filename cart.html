<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyKnits - Shopping Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
   <header>

    <nav id="topbar">
     <section class="navigationbar">
      <menu>

       <li>
         <a href="mainpage.html" title="Main Page"> 
          <h3>Home</h3> 
         </a>
       </li>

       <li>
         <a href="tops.html" title="Knit Tops"> 
          <h3>Tops</h3> 
         </a>
       </li>

       <li>
         <a href="cardigans.html" title="Knit Cardigans"> 
          <h3>Cardigans</h3> 
         </a>
       </li>

       <li>
         <a href="sweaters.html" title="Knit Sweaters"> 
          <h3>Sweaters</h3> 
         </a>
       </li>
      </menu>

     </section>
    <!--The html above defines only the structure of the navigation bar and its links-->

     <section class="searchandcart">

      <a href="cart.html" title="Cart"> 
        <h3>Cart</h3> 
      </a>
      
      <search>
      <input type="text" placeholder="Search for clothing items...">
      </search>

     </section>
    </nav>
   </header>
  <!--The html code above defines the full structure of the top bar--> 

   <main>
    <section id="cartsearchbar">
      <search>
        <input type="search" name="cartsearch" id="cartsearch" placeholder="Search for items in your cart...">
      </search>
    </section>
   </main>

   <section id="cartitems">
      <ul>

       <li>
        <div>
         <img src="/Product Images/Blue and White Star Top.png" alt="Blue and White Star Top">
         </div>
         <div class="itemdetails">
         <a href="startop.html"><h2>Blue and White Star Top</h2></a>
         <p>$19.00</p>
         <form action="cart.html">

        <fieldset id="Sizing">
         <legend>Sizing Options</legend>

         <select name="sizing" id="sizing" required>

          <optgroup label="Size Small">
           <option value="">UK 8</option>
           <option value="">UK 9</option>
           <option value="">UK 10</option>
          </optgroup>

          <optgroup label="Size Medium">
           <option value="">UK 12</option>
           <option value="">UK 13</option>
           <option value="">UK 14</option>
          </optgroup>

          <optgroup label="Size Large">
           <option value="">UK 15</option>
           <option value="">UK 16</option>
           <option value="">UK 17</option>
          </optgroup>
         </select>

        </fieldset>

        <fieldset id="productquantity">
         <legend>Quantity</legend>
         <input type="number" name="quantity" id="quantity" min="1" max="4" value="1" required>
        </fieldset>
        
      </form>
         <input type="submit" value="Remove from Cart" id="removecartitem" name="removecartitem">
         </div>
       </li>
        

      </ul>

      <input type="submit" value="Go To Checkout" id="checkout" name="checkout">
     </section>

</body>
</html>
